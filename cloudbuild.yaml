steps:
  # 1. Build de l'image Docker avec tag commit et latest
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/gave-repo/frontend:$COMMIT_SHA'
      - '-t'
      - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/gave-repo/frontend:latest'
      - '.'

  # 2. Envoi de l'image sur Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/gave-repo/frontend'

  # 3. Déploiement automatique sur Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'gave-frontend'
      - '--image'
      - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/gave-repo/frontend:$COMMIT_SHA'
      - '--region'
      - '$_LOCATION'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      # Scalabilité & limitation des coûts
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '5'
      - '--concurrency'
      - '80'
      - '--cpu-throttling'
      - '--cpu'
      - '1'
      - '--memory'
      - '512Mi'

substitutions:
  _LOCATION: 'europe-west1' # ou 'europe-west9' (Paris)

images:
  - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/gave-repo/frontend:$COMMIT_SHA'
  - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/gave-repo/frontend:latest'
