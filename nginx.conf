server {
        listen 8080;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Compression gzip (gain de bande passante et de score au TP)
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

        # Gestion du Single Page Application (redirection vers index.html)
        location / {
            try_files $uri $uri/ /index.html;
        }

        # index.html ne doit jamais être mis en cache (garantit le rechargement immédiat des mises à jour)
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            try_files $uri =404;
        }

        # Scripts Flutter sans hash dans le nom : le navigateur doit revalider à chaque chargement
        # (sinon il garde l'ancienne version de l'appli jusqu'à un an après un déploiement)
        location ~ ^/(main\.dart\.js|flutter_bootstrap\.js|flutter\.js|flutter_service_worker\.js)$ {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        # Mise en cache des assets statiques (images, scripts, polices)
        location ~* \.(?:ico|css|js|gif|jpe?g|png|wasm|woff2?|ttf|svg)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Health check pour Cloud Run
        location = /healthz {
            access_log off;
            return 200 "OK\n";
        }

        # Configuration lue par l'appli au démarrage.
        # ${API_URL} est remplacé au lancement du conteneur par la variable d'environnement Cloud Run.
        location = /config.json {
            default_type application/json;
            add_header Cache-Control "no-cache";
            return 200 '{"apiUrl":"${API_URL}"}';
        }
    }